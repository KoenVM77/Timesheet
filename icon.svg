<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <clipPath id="cr"><rect width="186" height="186" rx="42"/></clipPath>
  </defs>
  <!-- Shadow -->
  <rect x="4" y="6" width="186" height="186" rx="42" fill="rgba(0,0,0,0.15)"/>
  <!-- White card -->
  <rect width="186" height="186" rx="42" fill="#ffffff"/>
  <!-- Red top bar -->
  <rect width="186" height="44" rx="42" fill="#db0f16"/>
  <rect y="20" width="186" height="24" fill="#db0f16"/>
  <!-- TS label -->
  <text x="93" y="34" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-weight="700" font-size="22" fill="#ffffff" letter-spacing="2">TS</text>
  <!-- Clock face -->
  <circle cx="93" cy="122" r="56" fill="#f8fafc" stroke="#db0f16" stroke-width="4"/>
  <!-- Hour marks -->
  <line x1="93" y1="70" x2="93" y2="78" stroke="#db0f16" stroke-width="3" stroke-linecap="round"/>
  <line x1="145" y1="122" x2="137" y2="122" stroke="#db0f16" stroke-width="3" stroke-linecap="round"/>
  <line x1="93" y1="174" x2="93" y2="166" stroke="#db0f16" stroke-width="3" stroke-linecap="round"/>
  <line x1="41" y1="122" x2="49" y2="122" stroke="#db0f16" stroke-width="3" stroke-linecap="round"/>
  <!-- Hour hand ~10 -->
  <line x1="93" y1="122" x2="68" y2="99" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
  <!-- Minute hand ~2 -->
  <line x1="93" y1="122" x2="121" y2="93" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="93" cy="122" r="6" fill="#db0f16"/>
</svg>
